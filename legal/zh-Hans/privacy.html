<h1>隐私协议</h1>
<p>Luma 不需要账号。你不必登录或注册即可使用。</p>
<p>录制文件和设置默认保存在你这台电脑上。正常使用时，Luma 不会把成片上传到供应商云端。</p>
<p>可选的局域网访问只发生在你自己的网络里。打开后，由你允许的设备可以访问这台电脑，并不会把文件发到 Luma 的服务器。</p>
<p>屏幕、麦克风和摄像头只有在你主动开始对应功能时才会采集。Luma 不会在你未操作时后台偷录。</p>
</body>
